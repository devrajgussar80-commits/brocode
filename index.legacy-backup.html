    <meta charset="UTF-8" />

    <title>Meta Liquid Funds</title>
    <style>
      html { background: #eef4fb; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #f7fbff 0%, #eaf2fb 100%); color: #062253; }
      button, input { font: inherit; }
      .auth-page { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px 18px; }
      .auth-page h1 { margin: 4px 0 0; font-size: 32px; line-height: 1.1; }
      .auth-page p, .auth-page small { margin: 0; color: #667793; }
      .auth-form { display: grid; gap: 12px; }
      .auth-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
      .auth-form input { width: 100%; box-sizing: border-box; border: 1px solid #cdd8e8; border-radius: 12px; padding: 13px 14px; color: #062253; background: #fff; }
      .password-input { display: flex; align-items: center; gap: 8px; }
      .password-input input { flex: 1; }
      .password-input button, .auth-switch, .primary { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; }
      .primary { background: #0b63ce; color: #fff; }
      .auth-switch { background: #fff; color: #0b63ce; border: 1px solid #cdd8e8; }
      .form-error { border-radius: 12px; background: #ffeef0; color: #b42318; padding: 10px 12px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
