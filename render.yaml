services:
  - type: web
    name: brocode-api
    runtime: docker
    plan: free
    # Neon is in us-east-2; keeping the backend in the same region matters a lot
    # here because the admin dashboard makes many sequential queries.
    region: ohio
    healthCheckPath: /api/health
    envVars:
      # Neon connection string. Use the -pooler host for the app.
      # Set this in the Render dashboard - never commit it.
      - key: DATABASE_URL
        sync: false

      # Admin dashboard password. Render generates a strong value; without it the
      # code falls back to a default that is public in this repository.
      - key: NIVESH_ADMIN_TOKEN
        generateValue: true

      # Comma-separated origins allowed to call the API. Set to your Vercel
      # domain, e.g. https://brocode.vercel.app
      # Only needed if the customer app calls this API directly. If Vercel
      # proxies /api via the rewrite in vercel.json, requests are same-origin
      # and this can stay empty.
      - key: ALLOWED_ORIGINS
        sync: false

      # Razorpay credentials
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Required on plans without a persistent disk (including Free): pins the
      # bank-data encryption key so it survives restarts. Without it the key is
      # regenerated on every restart and stored bank accounts cannot be decrypted.
      # Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: NIVESH_BANK_DATA_KEY
        sync: false

      # Directory anchor for uploaded files (receipts, plan images).
      - key: NIVESH_DB_PATH
        value: /tmp/brocode.db

    # No disk: Free instances do not support persistent disks. Uploaded receipt
    # and plan images are therefore lost on restart. All records live in Postgres,
    # so only the image files are affected. Attach a disk on a paid plan and point
    # NIVESH_DB_PATH at its mount path to keep them.
