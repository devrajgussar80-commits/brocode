<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <title>BroCode Admin</title>
    <style>
      html { background: #050506; color-scheme: dark; font-family: Archivo, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: #050506; color: #F3F3F5; }
      button, input { font: inherit; }
      #root:empty::after {
        content: "";
        position: fixed;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border-radius: 50%;
        border: 3px solid #2B2B33;
        border-top-color: #FFC400;
        animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-main.jsx"></script>
  </body>
</html>
